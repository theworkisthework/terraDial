name: Release firmware

# Tag a commit and push the tag; everything an end user needs comes out the
# other side, for each supported board:
#
#   CrowPanel 1.28"               Waveshare Knob 1.8"
#   terradial-ota.bin             terradial-knob18-ota.bin
#   terradial-factory.bin         terradial-knob18-factory.bin
#
#   * *-ota.bin      -- the app image the panel flashes itself with
#                       (Settings > About > Check for updates). Each board
#                       asks for its own by name -- BOARD_OTA_ASSET_NAME in
#                       include/boards/ -- so an update can't cross boards.
#   * *-factory.bin  -- bootloader + partitions + app, flashed at 0x0 by the
#                       web installer, and the only thing that works on a
#                       blank board
#
# The CrowPanel's names carry no board suffix because they predate the Knob,
# and panels already in the field ask for them. Don't rename them.
#
# Both are attached to the GitHub Release. Publishing the installer PAGE is
# a separate workflow (pages.yml) that this one triggers on success -- the
# github-pages environment refuses deployments from a tag, and this workflow
# only ever runs from one. See the note at the top of pages.yml.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        # The tag minus its leading "v" is the version the firmware reports
        # and the updater compares against. tools/version.py picks it up from
        # TERRADIAL_VERSION below.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Build firmware
        # No secrets.h here on purpose: without one, settings.cpp falls back
        # to an empty SSID, so a public build ships with no network baked in
        # and the user picks theirs on-device (Settings > Wi-Fi > scan).
        env:
          TERRADIAL_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e crowpanel-1_28-rotary -e waveshare-knob-1_8

      - name: Assemble release images
        run: |
          set -eu
          mkdir -p dist

          # boot_app0.bin lives in the Arduino framework package, not the
          # build directory, and its path carries the package version.
          BOOT_APP0="$(find ~/.platformio/packages -name boot_app0.bin | head -n1)"
          test -n "$BOOT_APP0"

          # assemble <pio env> <asset prefix>
          assemble() {
            BUILD=".pio/build/$1"

            # The app image, exactly as it lands in app0/app1. This is what
            # the on-device updater downloads -- BOARD_OTA_ASSET_NAME in that
            # board's include/boards/ header has to keep matching it.
            cp "$BUILD/firmware.bin" "dist/$2-ota.bin"

            # Offsets are ESP32-S3's, and the bootloader one is the trap: it
            # sits at 0x0 here, not the 0x1000 the original ESP32 uses.
            # Both boards are S3s on the same partition table, so the same
            # offsets serve both. "keep" leaves flash mode/frequency/size
            # exactly as PlatformIO built them into the bootloader header,
            # so the merged image boots identically to a `pio run -t upload`.
            esptool.py --chip esp32s3 merge_bin \
              -o "dist/$2-factory.bin" \
              --flash_mode keep --flash_freq keep --flash_size keep \
              0x0     "$BUILD/bootloader.bin" \
              0x8000  "$BUILD/partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 "$BUILD/firmware.bin"
          }

          assemble crowpanel-1_28-rotary terradial
          assemble waveshare-knob-1_8    terradial-knob18

          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: terraDial ${{ steps.version.outputs.version }}
          generate_release_notes: true
          # A tag with a hyphen in it -- v0.2.0-rc1 -- publishes as a
          # prerelease, which is how you get a real, downloadable build
          # without every panel in existence being offered it: the panel
          # asks GitHub for `releases/latest`, and that endpoint skips
          # prereleases and drafts.
          #
          # It also defuses a sharp edge in the updater. versionRank() stops
          # at the first non-digit, so "0.2.0-rc1" ranks IDENTICALLY to
          # "0.2.0" -- two different builds it can't tell apart. Keeping
          # suffixed tags out of `latest` means it never has to.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/terradial-ota.bin
            dist/terradial-factory.bin
            dist/terradial-knob18-ota.bin
            dist/terradial-knob18-factory.bin
