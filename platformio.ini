; PlatformIO Project Configuration File
;
; terraDial -- round touch+knob display, standalone control panel for a
; terraPen FluidNC pen plotter. One firmware, one env per supported board;
; the board-specific bits (pins, panel driver, knob type, what the board
; has and hasn't got) live in include/boards/ and are picked by the
; BOARD_* define each env sets. See include/pins.h.
;
; Both boards are ESP32-S3R8: 16MB flash, 8MB octal PSRAM. The generic
; esp32-s3-devkitc-1 board definition doesn't turn PSRAM/flash-size on by
; default, so those are set explicitly below to match the real hardware
; (confirmed against Elecrow's factory example project settings for the
; CrowPanel, and Waveshare's demo sdkconfig for the Knob).

; A bare `pio run -t upload` would otherwise build and flash EVERY env in
; turn -- i.e. flash the wrong board's firmware second. The Knob is built
; with -e waveshare-knob-1_8.
[platformio]
default_envs = crowpanel-1_28-rotary

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

extra_scripts = pre:tools/version.py

board_build.arduino.memory_type = qio_opi
; Two app slots plus otadata -- this is what the on-device updater
; (src/net/ota_updater.h) flashes into. A single-app table would build
; and run fine and then fail every OTA at the point of no return.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; WebSockets' frame reader spins until a partially-arrived frame
    ; completes, giving up only after this long. The 5s default meant one
    ; hiccup mid-frame wedged the network task for 5 seconds (and, before
    ; the networkTask split, the entire UI with it). 1500ms still tolerates
    ; a slow SD listing without turning a blip into a visible freeze.
    -DWEBSOCKETS_TCP_TIMEOUT=1500

lib_deps =
    lvgl/lvgl@^8.3.11
    lovyan03/LovyanGFX@^1.2.30
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

monitor_speed = 115200

; Elecrow CrowPanel 1.28" Rotary Display: 240x240 GC9A01 over SPI, CST816D
; touch, push-button encoder, 5-LED ring.
[env:crowpanel-1_28-rotary]
build_flags =
    ${env.build_flags}
    -DBOARD_CROWPANEL_1_28

; Waveshare ESP32-S3-Knob-Touch-LCD-1.8: 360x360 ST77916 over QSPI, CST816
; touch, knob without a push switch, DRV2605 haptics, no LED ring.
; LGFX_USE_QSPI turns on LovyanGFX's quad-SPI bus, which the ST77916 needs
; (and 1.2.30 is the first LovyanGFX with Panel_ST77916, hence the floor
; on lib_deps above).
[env:waveshare-knob-1_8]
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_KNOB_1_8
    -DLGFX_USE_QSPI
